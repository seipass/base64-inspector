[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "base64-inspector"
version = "1.0.0"
description = "Decode Base64 text and report UTF-8 text when possible."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "seipass"}]

[project.scripts]
base64-inspector = "base64_inspector:main"

[tool.setuptools]
py-modules = ["base64_inspector"]

[tool.pytest.ini_options]
pythonpath = ["."]
